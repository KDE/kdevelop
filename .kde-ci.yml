Dependencies:
- 'on': ['@all']
  'require':
    'frameworks/kcmutils': 'Frameworks/6.24'
    'frameworks/kitemmodels': 'Frameworks/6.24'
    'frameworks/knewstuff': 'Frameworks/6.24'
    'frameworks/knotifyconfig': 'Frameworks/6.24'
    'frameworks/ktexteditor': 'Frameworks/6.24'
    'frameworks/ktexttemplate': 'Frameworks/6.24'
    'frameworks/purpose': 'Frameworks/6.24'
    'frameworks/threadweaver': 'Frameworks/6.24'
    'kdevelop/kdevelop-pg-qt': '@latest-kf6'
    'sdk/libkomparediff2': '@same'
    # TODO: Okteta Qt6 port not yet complete, ETA 10/2024 or later. Once available, adapt code & reenable again.
    # 'utilities/okteta': '@stable'

- 'on': ['Linux', 'FreeBSD']
  'require':
    'frameworks/krunner': 'Frameworks/6.24'
    'plasma/libksysguard': '@latest-kf6'
    'plasma/libplasma': '@latest-kf6'

Options:
  per-test-timeout: 200 # the 60-second default is not enough for test_gdb
  use-ccache: True
  allow-failing-tests-on: ['@all']
